<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cat Adoption Agency</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Happy Paws Cat Adoption</h1>
    <p class="tagline">Find your purrfect companion</p>
  </header>

  <main>
    <section class="cat-container" aria-label="Cat breeds">
      <!-- Cards injected by the script below -->
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Happy Paws Cat Adoption</p>
  </footer>

  <script>
    // Keep filenames exactly as they appear in my images folder
    const cats = [
      { file: 'images/siamese.jpg.jpeg', name: 'Siamese', desc: 'Affectionate, vocal, and intelligent.' },
      { file: 'images/maine-coon.jpg.jpeg', name: 'Maine Coon', desc: 'Large, gentle, and friendly.' },
      { file: 'images/bengal.jpg.jpeg', name: 'Bengal', desc: 'Energetic and playful with a striking coat.' },
      { file: 'images/persian.jpg.jpeg', name: 'Persian', desc: 'Calm and affectionate; prefers a relaxed home.' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('.cat-container');

      cats.forEach(cat => {
        const article = document.createElement('article');
        article.className = 'cat-breed';
        article.innerHTML = `
          <img src="${cat.file}" alt="${cat.name} cat" loading="lazy" />
          <h3>${cat.name}</h3>
          <p>${cat.desc}</p>
          <a class="cta" href="${cat.name.toLowerCase().replace(/\s+/g,'-')}.html">Learn more</a>
        `;
        container.appendChild(article);
      });

      document.getElementById('year').textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
